name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run playground:build
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Red-team harness
        run: node dist/cli.js harness --report harness/REPORT.md
      - name: Schemas are up to date
        run: npx tsx scripts/emit-schemas.ts && git diff --exit-code schemas/ harness/REPORT.md
